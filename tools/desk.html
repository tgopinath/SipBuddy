<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;background:radial-gradient(70% 80% at 15% 20%,#c8f1f7,transparent 60%),radial-gradient(60% 70% at 90% 90%,#5fb4f0,transparent 65%),linear-gradient(160deg,#e6f8fb,#9fd8f2 60%,#3f8fe0);position:relative}
.mb{position:absolute;inset:0 0 auto 0;height:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 18px;font-size:13.5px;color:#1d1d1f;gap:22px}
.mb b{font-weight:700}.mb .r{margin-left:auto;display:flex;gap:18px;align-items:center}
.mb .ic{width:22px;height:22px;border-radius:5px;background:rgba(0,0,0,.12);display:grid;place-items:center}
.mb .ic img{width:18px;height:18px}
.arrow{position:absolute;top:33px;right:228px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:2px;box-shadow:-.5px -.5px 0 rgba(0,0,0,.18)}
.pop{position:absolute;top:40px;right:110px;width:487px;height:493px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 30px 70px -20px rgba(10,50,110,.55)}
.pop img{width:100%;height:100%;display:block}
.hero{position:absolute;left:84px;top:190px;width:640px;color:#0d2a4a}
.hero img{width:190px;height:190px;margin-left:-14px;filter:drop-shadow(0 20px 30px rgba(10,60,120,.25))}
.hero h1{font-size:54px;letter-spacing:-.02em;margin:8px 0 10px;font-weight:800}
.hero p{font-size:22px;line-height:1.45;margin:0 0 26px;color:#1f4a72;max-width:580px}
.keys{display:flex;gap:12px;flex-wrap:wrap}
.keys span{background:rgba(255,255,255,.72);border-radius:10px;padding:9px 14px;font-size:17px;color:#123a63;box-shadow:0 1px 0 rgba(0,0,0,.06)}
</style></head><body>
<div class="mb"><b></b><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span>
<div class="r"><span class="ic"><img src="icon.png" alt=""></span><span>Wi‑Fi</span><span>Tue 17 Nov&nbsp; 7:42 PM</span></div></div>
<div class="arrow"></div>
<div class="pop"><img src="popover.png" alt=""></div>
<div class="hero"><img src="icon.png" alt=""><h1>SipBuddy</h1><p>A menu bar buddy that reminds you to drink water, and only goes away once the camera sees you drinking.</p>
<div class="keys"><span>5 swallows to close</span><span>On-device Vision</span><span>4 personalities</span></div></div>
</body></html>
